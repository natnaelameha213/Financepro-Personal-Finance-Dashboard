<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinancePro — Budgets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><i class="bi bi-graph-up-arrow"></i></div>
      <div><h1>FinancePro</h1><small>Your Money · Better Tomorrow</small></div>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="transactions.html" class="nav-item"><i class="bi bi-arrow-left-right"></i> Transactions</a>
      <a href="add-income.html" class="nav-item"><i class="bi bi-plus-circle"></i> Add Income</a>
      <a href="add-expense.html" class="nav-item"><i class="bi bi-dash-circle"></i> Add Expense</a>
      <a href="budgets.html" class="nav-item active"><i class="bi bi-pie-chart"></i> Budgets</a>
      <a href="savings.html" class="nav-item"><i class="bi bi-piggy-bank"></i> Savings Goals</a>
      <a href="reports.html" class="nav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
      <a href="settings.html" class="nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-toggle">
        <i class="bi bi-moon-stars"></i>
        <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="themeToggle"></div>
        <i class="bi bi-sun"></i>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
      <h5 class="mb-0 ms-2">Budgets</h5>
      <div class="header-actions">
        <button class="btn-primary-custom" onclick="openAddBudget()"><i class="bi bi-plus me-1"></i> Add Budget</button>
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=Natnael+Ameha&background=10b981&color=fff" alt="User">
          <div class="info"><div class="name">Natnael Ameha</div><div class="role">Premium Member</div></div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-title">
        <h2><i class="bi bi-pie-chart me-2"></i>Monthly Budgets</h2>
      </div>
      <p class="text-muted mb-4" style="font-size:0.9rem;">Track your spending against category budgets. Warnings appear when you exceed limits.</p>
      <div class="budget-grid" id="budgetGrid"></div>
    </div>
    <footer class="app-footer">© 2025 FinancePro</footer>
  </div>

  <!-- Budget Modal -->
  <div class="modal fade" id="budgetModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="budgetModalTitle">Add Budget</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="saveBudget(event)">
          <div class="modal-body">
            <input type="hidden" id="budgetId">
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" id="budgetCategory">
                <option>Food</option><option>Rent</option><option>Transport</option>
                <option>Entertainment</option><option>Shopping</option>
                <option>Bills</option><option>Health</option><option>Education</option><option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Monthly Limit ($)</label>
              <input type="number" step="0.01" min="1" class="form-control" id="budgetLimit" required placeholder="e.g. 300">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-primary-custom">Save Budget</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/budgets.js"></script>
</body>
</html>
