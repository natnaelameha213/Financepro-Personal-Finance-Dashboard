<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinancePro — Savings Goals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><i class="bi bi-graph-up-arrow"></i></div>
      <div><h1>FinancePro</h1><small>Your Money · Better Tomorrow</small></div>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="transactions.html" class="nav-item"><i class="bi bi-arrow-left-right"></i> Transactions</a>
      <a href="add-income.html" class="nav-item"><i class="bi bi-plus-circle"></i> Add Income</a>
      <a href="add-expense.html" class="nav-item"><i class="bi bi-dash-circle"></i> Add Expense</a>
      <a href="budgets.html" class="nav-item"><i class="bi bi-pie-chart"></i> Budgets</a>
      <a href="savings.html" class="nav-item active"><i class="bi bi-piggy-bank"></i> Savings Goals</a>
      <a href="reports.html" class="nav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
      <a href="settings.html" class="nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-toggle">
        <i class="bi bi-moon-stars"></i>
        <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="themeToggle"></div>
        <i class="bi bi-sun"></i>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
      <h5 class="mb-0 ms-2">Savings Goals</h5>
      <div class="header-actions">
        <button class="btn-primary-custom" onclick="openAddGoal()"><i class="bi bi-plus me-1"></i> Add Goal</button>
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=Natnael+Ameha&background=10b981&color=fff" alt="User">
          <div class="info"><div class="name">Natnael Ameha</div><div class="role">Premium Member</div></div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-title">
        <h2><i class="bi bi-piggy-bank me-2"></i>Savings Goals</h2>
      </div>
      <p class="text-muted mb-4" style="font-size:0.9rem;">Set financial goals and track your progress toward them.</p>
      <div class="budget-grid" id="goalsGrid"></div>
    </div>
    <footer class="app-footer">© 2025 FinancePro</footer>
  </div>

  <!-- Goal Modal -->
  <div class="modal fade" id="goalModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="goalModalTitle">Create Savings Goal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="saveGoal(event)">
          <div class="modal-body">
            <input type="hidden" id="goalId">
            <div class="mb-3">
              <label class="form-label">Goal Name *</label>
              <input type="text" class="form-control" id="goalName" required placeholder="e.g. Emergency Fund">
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label">Target Amount *</label>
                <input type="number" step="0.01" min="1" class="form-control" id="goalTarget" required>
              </div>
              <div class="col-6">
                <label class="form-label">Already Saved</label>
                <input type="number" step="0.01" min="0" class="form-control" id="goalSaved" value="0">
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label">Icon</label>
                <select class="form-select" id="goalIcon">
                  <option value="bi-shield-check">Shield</option>
                  <option value="bi-laptop">Laptop</option>
                  <option value="bi-airplane">Airplane</option>
                  <option value="bi-house">House</option>
                  <option value="bi-car-front">Car</option>
                  <option value="bi-piggy-bank">Piggy Bank</option>
                  <option value="bi-gift">Gift</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Color</label>
                <input type="color" class="form-control form-control-color w-100" id="goalColor" value="#10b981">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-primary-custom">Save Goal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Add Money Modal -->
  <div class="modal fade" id="addMoneyModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Money</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="saveAddMoney(event)">
          <div class="modal-body">
            <input type="hidden" id="addMoneyGoalId">
            <div class="mb-3">
              <label class="form-label">Amount to Add</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="addMoneyAmount" required placeholder="0.00">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-primary-custom">Add</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/savings.js"></script>
</body>
</html>
