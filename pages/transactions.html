<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinancePro — Transactions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar-overlay"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><i class="bi bi-graph-up-arrow"></i></div>
      <div><h1>FinancePro</h1><small>Your Money · Better Tomorrow</small></div>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="transactions.html" class="nav-item active"><i class="bi bi-arrow-left-right"></i> Transactions</a>
      <a href="add-income.html" class="nav-item"><i class="bi bi-plus-circle"></i> Add Income</a>
      <a href="add-expense.html" class="nav-item"><i class="bi bi-dash-circle"></i> Add Expense</a>
      <a href="budgets.html" class="nav-item"><i class="bi bi-pie-chart"></i> Budgets</a>
      <a href="savings.html" class="nav-item"><i class="bi bi-piggy-bank"></i> Savings Goals</a>
      <a href="reports.html" class="nav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
      <a href="settings.html" class="nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-toggle">
        <i class="bi bi-moon-stars"></i>
        <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="themeToggle"></div>
        <i class="bi bi-sun"></i>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search transactions..." id="txSearch">
      </div>
      <div class="header-actions">
        <a href="add-income.html" class="btn btn-sm btn-success" style="border-radius:8px;"><i class="bi bi-plus"></i> Income</a>
        <a href="add-expense.html" class="btn btn-sm btn-danger" style="border-radius:8px;"><i class="bi bi-dash"></i> Expense</a>
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=Natnael+Ameha&background=10b981&color=fff" alt="User">
          <div class="info"><div class="name">Natnael Ameha</div><div class="role">Premium Member</div></div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-title">
        <h2><i class="bi bi-arrow-left-right me-2"></i>Transactions</h2>
        <span class="text-muted" style="font-size:0.9rem;"><span id="txCount">0</span> records</span>
      </div>

      <div class="filters-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="income">Income</button>
        <button class="filter-btn" data-filter="expense">Expense</button>
        <button class="filter-btn" data-filter="Food">Food</button>
        <button class="filter-btn" data-filter="Rent">Rent</button>
        <button class="filter-btn" data-filter="Transport">Transport</button>
        <button class="filter-btn" data-filter="Entertainment">Entertainment</button>
        <button class="filter-btn" data-filter="Shopping">Shopping</button>
        <button class="filter-btn" data-filter="Bills">Bills</button>
        <button class="filter-btn" data-filter="Other">Other</button>
        <select class="chart-select ms-auto" id="sortSelect">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="highest">Highest Amount</option>
          <option value="lowest">Lowest Amount</option>
        </select>
      </div>

      <div class="section-card">
        <div class="table-responsive">
          <table class="tx-table">
            <thead>
              <tr>
                <th></th>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <footer class="app-footer">© 2025 FinancePro</footer>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="saveEdit(event)">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" id="editDescription" required>
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" id="editAmount" required>
              </div>
              <div class="col-6">
                <label class="form-label">Type</label>
                <select class="form-select" id="editType">
                  <option value="income">Income</option>
                  <option value="expense">Expense</option>
                </select>
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <label class="form-label">Category</label>
                <select class="form-select" id="editCategory">
                  <option>Income</option><option>Food</option><option>Rent</option>
                  <option>Transport</option><option>Entertainment</option>
                  <option>Shopping</option><option>Bills</option><option>Health</option>
                  <option>Education</option><option>Other</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="editDate" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="editPayment">
                <option>Card</option><option>Bank</option><option>Cash</option><option>Mobile</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" id="editNotes" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-primary-custom">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/transactions.js"></script>
</body>
</html>
